name: lake build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: lake-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pure-Lean (Init only): no Mathlib, no native FFI. Just typecheck Shared.
      - name: setup toolchain + build Shared
        uses: leanprover/lean-action@v1
        with:
          build-args: "Shared"
          test: false
          lint: false
